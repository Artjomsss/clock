<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Часы</title>
<style>
:root {
  --bg: #eef2f6;
  --ink: #14202b;
  --muted: #5b6b7a;
  --line: #c9d3dd;
  --accent: #1f6feb;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1923;
    --ink: #e8eef4;
    --muted: #8fa1b2;
    --line: #2a3a4a;
    --accent: #5aa2ff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1923;
  --ink: #e8eef4;
  --muted: #8fa1b2;
  --line: #2a3a4a;
  --accent: #5aa2ff;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
}
main { text-align: center; padding: 24px; }
#time {
  font-size: clamp(3.5rem, 18vw, 9rem);
  font-weight: 300;
  letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums;
  line-height: 1;
}
#date {
  margin-top: 16px;
  font-size: clamp(1rem, 4vw, 1.4rem);
  color: var(--muted);
}
#zone {
  margin-top: 4px;
  font-size: 0.9rem;
  color: var(--muted);
}
button {
  margin-top: 32px;
  font: inherit;
  color: var(--accent);
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 10px 20px;
  cursor: pointer;
}
button:hover { border-color: var(--accent); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <div id="time" aria-live="off">--:--:--</div>
  <div id="date"></div>
  <div id="zone"></div>
  <button id="toggle" type="button">Показать 12-часовой формат</button>
</main>
<script>
(function () {
  var timeEl = document.getElementById('time');
  var dateEl = document.getElementById('date');
  var zoneEl = document.getElementById('zone');
  var btn = document.getElementById('toggle');
  var hour12 = false;

  zoneEl.textContent = Intl.DateTimeFormat().resolvedOptions().timeZone;

  function tick() {
    var now = new Date();
    timeEl.textContent = now.toLocaleTimeString('ru-RU', {
      hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: hour12
    });
    dateEl.textContent = now.toLocaleDateString('ru-RU', {
      weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
    });
  }

  btn.addEventListener('click', function () {
    hour12 = !hour12;
    btn.textContent = hour12 ? 'Показать 24-часовой формат' : 'Показать 12-часовой формат';
    tick();
  });

  tick();
  setInterval(tick, 1000);
})();
</script>
</body>
</html>
